<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#04070c">
<meta name="description" content="flow — 一池水，一点声音，一块白板。为专注与捕捉想法而生。">
<title>flow — 一池水，一点声音，一块白板</title>
<link rel="stylesheet" href="css/style.css?v=6">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='6' fill='%23bcd6ff'/></svg>">
</head>
<body class="is-loading">

<!-- ── 水面：整屏程序化 WebGL ───────────────────────────────── -->
<canvas id="water" aria-hidden="true"></canvas>

<!-- WebGL 不可用时的降级背景 -->
<div id="fallback" aria-hidden="true"></div>

<!-- ── 白板：base = 已完成笔迹，live = 正在画的一笔 ──────────── -->
<canvas id="board" aria-hidden="true"></canvas>
<canvas id="board-live" aria-hidden="true"></canvas>

<!-- ── 字块之间的连线（SVG，压在笔迹之上、字块之下） ─────────── -->
<svg id="edges" aria-hidden="true">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="rgba(190,215,255,.75)"></path>
    </marker>
  </defs>
  <g id="edge-layer"></g>
  <path id="edge-preview" d="" fill="none"></path>
</svg>

<!-- ── 文字工具的整屏接收层 ─────────────────────────────────────
     刻意不加 transform：它的命中区域永远等于视口，
     否则缩放后「空白处点击新建」会在边缘失效（漏给画笔）。 -->
<div id="text-catch" aria-hidden="true"></div>

<!-- ── 字块层（会跟着相机缩放，所以在接收层之上） ───────────── -->
<div id="nodes"></div>

<!-- ── 界面层 ──────────────────────────────────────────────── -->
<div id="ui">

  <header class="row row-top">
    <a class="brand" href="./" title="flow">flow<span>.</span></a>
    <p class="meta">A QUIET SPACE <span class="sep">—</span> 专注 · 捕捉</p>
  </header>

  <div class="row row-mid-left">
    <!-- 湖面时间拨码：竖在左边，往上拨是凌晨、往下拨是深夜 -->
    <div class="sun" id="sun-panel">
      <button type="button" id="sun-auto" class="sun-auto on" aria-pressed="true"
              title="跟随当前时间">自动</button>
      <div class="sun-slider">
        <input type="range" id="sun-range" min="0" max="1439" step="5" value="720"
               aria-label="湖面时间（上下拖动可预览一天里不同时刻的水面）">
        <div class="sun-ticks" aria-hidden="true">
          <span>0</span><span>6</span><span>12</span><span>18</span><span>24</span>
        </div>
      </div>
      <div class="sun-label">
        <span class="sun-time" id="sun-time">--:--</span>
        <span class="sun-phase" id="sun-phase">--</span>
      </div>
    </div>

    <div class="left-stack">
      <p class="clock" id="clock" title="按 T 显示 / 隐藏">
        <span class="clock-time" id="clock-text">--:--:--</span>
        <span class="clock-ampm" id="clock-ampm">p.m.</span>
      </p>

      <nav class="hints" aria-label="快捷键">
        <button type="button" data-act="board"><kbd>B</kbd> 白板</button>
        <button type="button" data-act="clock"><kbd>T</kbd> 时间</button>
        <button type="button" data-act="preset"><kbd>S</kbd> 音景</button>
        <button type="button" data-act="mute"><kbd>M</kbd> 静音</button>
        <button type="button" data-act="hide"><kbd>H</kbd> 隐藏界面</button>
      </nav>
    </div>
  </div>

  <div class="row row-bottom-right">
    <p class="status" id="status" role="status"></p>
    <div class="panel" id="panel-sound">
      <span class="panel-label">音景</span>
      <div class="seg" role="group" aria-label="音景切换">
        <button type="button" data-preset="lake" class="on">夜湖</button>
        <button type="button" data-preset="rain">细雨</button>
        <button type="button" data-preset="birds">鸟鸣</button>
      </div>
      <label class="vol">
        <span class="sr">音量</span>
        <input type="range" id="volume" min="0" max="100" value="70" aria-label="音量">
      </label>
    </div>
  </div>

</div>

<!-- ── 分页标签（像 Excel 的 sheet） ──────────────────────────── -->
<div id="sheets" role="tablist" aria-label="白板分页"></div>

<!-- ── 白板工具条 ───────────────────────────────────────────── -->
<div id="toolbar" role="toolbar" aria-label="白板工具">
  <button type="button" data-tool="pen" class="on" title="画笔 (P)">
    <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 16l1-3.5L13 4.5l2.5 2.5L7.5 15 4 16z"/></svg><span>画笔</span>
  </button>
  <button type="button" data-tool="eraser" title="橡皮 (E)">
    <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M7 15H16M4.5 12.5l4-4 4 4-3 3H6l-1.5-1.5z"/></svg><span>橡皮</span>
  </button>
  <button type="button" data-tool="text" title="文字块 (X)：在空白处点击新建">
    <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 5h12M10 5v10M7.5 15h5"/></svg><span>文字</span>
  </button>
  <span class="tool-sep"></span>
  <div class="swatches" role="group" aria-label="颜色">
    <button type="button" class="sw on" data-ink="0" title="水光白"><i style="--c:#eaf2ff"></i></button>
    <button type="button" class="sw" data-ink="1" title="暖月黄"><i style="--c:#ffd9a0"></i></button>
    <button type="button" class="sw" data-ink="2" title="冷青"><i style="--c:#9fe8e0"></i></button>
  </div>
  <span class="tool-sep"></span>
  <button type="button" data-tool="undo" title="撤销 (Ctrl+Z)">
    <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M7 6H12.5A3.5 3.5 0 0 1 16 9.5v0A3.5 3.5 0 0 1 12.5 13H9M7 6l3-3M7 6l3 3"/></svg><span>撤销</span>
  </button>
  <button type="button" data-tool="clear" title="清空">
    <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 6h12M8 6V4h4v2M6 6l1 10h6l1-10"/></svg><span>清空</span>
  </button>
  <span class="tool-sep"></span>
  <button type="button" data-tool="zoom-out" class="icon-only" title="缩小 (−)">−</button>
  <button type="button" data-tool="zoom-reset" id="zoom-label" title="重置视图为 100% (0)">100%</button>
  <button type="button" data-tool="zoom-in" class="icon-only" title="放大 (+)">+</button>
  <button type="button" data-tool="zoom-fit" class="icon-only" title="缩放到全部内容">
    <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 7V4h3M17 7V4h-3M3 13v3h3M17 13v3h-3"/></svg>
  </button>
  <span class="tool-sep"></span>
  <button type="button" data-tool="import" title="导入工程文件或 .excalidraw（也可以直接把文件拖进窗口）">
    <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 13V4M6.5 7.5L10 4l3.5 3.5M4 16h12"/></svg><span>导入</span>
  </button>
  <button type="button" data-tool="export" id="export-btn" aria-haspopup="true" aria-expanded="false"
          title="导出：PNG / .excalidraw / 工程文件">
    <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 4v9M6.5 9.5L10 13l3.5-3.5M4 16h12"/></svg><span>导出</span>
  </button>
  <span class="tool-sep"></span>
  <button type="button" data-tool="exit" title="回到水面 (Esc)">
    <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 10h10M11 6l4 4-4 4"/></svg><span>水面</span>
  </button>
</div>

<!-- ── 导出菜单 ─────────────────────────────────────────────── -->
<div id="export-menu" role="menu" aria-label="导出格式">
  <button type="button" role="menuitem" data-export="png">
    <span class="em-name">PNG 图片</span>
    <span class="em-hint">当前页 · 2 倍分辨率 · 深色底</span>
  </button>
  <button type="button" role="menuitem" data-export="excalidraw">
    <span class="em-name">.excalidraw</span>
    <span class="em-hint">当前页 · 可拖进 Obsidian 的 Excalidraw</span>
  </button>
  <button type="button" role="menuitem" data-export="project">
    <span class="em-name">工程文件 .json</span>
    <span class="em-hint">含全部页 · 可再导入 · 无损</span>
  </button>
</div>

<!-- ── 进入页（浏览器要求用户手势才能出声） ─────────────────── -->
<div id="gate">
  <div class="gate-inner">
    <p class="gate-brand">flow<span>.</span></p>
    <p class="gate-line">一池水，一点声音，一块白板。</p>
    <button type="button" id="gate-btn">点击进入</button>
    <p class="gate-note">进入后会播放程序化环境音，可随时静音</p>
  </div>
</div>

<!-- 错误提示条（同时用于自动化检查） -->
<div id="err" role="alert" hidden></div>

<script src="js/store.js?v=6" defer></script>
<script src="js/camera.js?v=6" defer></script>
<script src="js/sun.js?v=6" defer></script>
<script src="js/water.js?v=6" defer></script>
<script src="js/audio.js?v=6" defer></script>
<script src="js/board.js?v=6" defer></script>
<script src="js/blocks.js?v=6" defer></script>
<script src="js/app.js?v=6" defer></script>
<input type="file" id="file-input" accept=".json,.excalidraw,application/json" hidden>
</body>
</html>
